name = "turbopg_smoke"
namespaces = 1
duration = "8s"
description = """
Local/CI smoke benchmark against turbopg-server using random 1024-d vectors.
"""

[setup]
wait_for_indexing = true
warm_cache = true
document_count = 64
datasource = "random"
document_template = """
{
    "id": {{ id }},
    "vector": {{ vector 1024 }}
}
"""
upsert_template = """
{
    "upsert_rows": [
        {{ .UpsertBatchPlaceholder }}
    ],
    "distance_metric": "euclidean_squared",
    "disable_backpressure": true
}
"""

[workload.query.ann]
qps = 2
concurrency = 2
datasource = "random"
template = """
{
    "top_k": 8,
    "rank_by": ["vector", "ANN", {{ vector 1024 }}],
    "filters": ["id", "Gte", 0]
}
"""
