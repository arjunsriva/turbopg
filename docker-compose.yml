services:
  postgres:
    build: ./docker/postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  turbopg:
    image: golang:1.23
    working_dir: /src
    volumes:
      - .:/src
    command: >
      bash -c "go build -o /tmp/turbopg-server ./cmd/turbopg-server && /tmp/turbopg-server"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
      TURBOPG_API_KEY: ${TURBOPG_API_KEY:-changeme}
      TURBOPG_LISTEN: 0.0.0.0:8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    stop_grace_period: 30s
