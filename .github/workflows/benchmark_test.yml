name: Turbopg Server Benchmark Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  benchmark-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout turbopg repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build Postgres 17 with pgvector and pg_textsearch
        run: docker build -t turbopg-pg:ci ./docker/postgres

      - name: Start Postgres
        run: |
          docker run -d --name turbopg-pg \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 5432:5432 \
            turbopg-pg:ci
          for i in $(seq 1 60); do
            if docker exec turbopg-pg pg_isready -U postgres -h 127.0.0.1; then
              exit 0
            fi
            sleep 1
          done
          docker logs turbopg-pg
          exit 1

      - name: Build turbopg-server
        run: make build-server

      - name: Run turbopg-server
        run: |
          ./bin/turbopg-server &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/readyz; then
              exit 0
            fi
            sleep 1
          done
          echo "server failed to start"
          exit 1
        env:
          DATABASE_URL: "postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable"
          TURBOPG_API_KEY: "testapikey"
          TURBOPG_ALLOW_INSECURE_API_KEY: "1"
          TURBOPG_PORT: "8080"

      - name: Checkout tpuf-benchmark
        uses: actions/checkout@v4
        with:
          repository: turbopuffer/tpuf-benchmark
          path: tpuf-benchmark

      - name: Build and run tpufbench smoke
        working-directory: ./tpuf-benchmark
        env:
          TURBOPUFFER_API_KEY: testapikey
          GOTOOLCHAIN: auto
        run: |
          go build -o tpufbench ./cmd/tpufbench
          ./tpufbench run \
            --endpoint="http://127.0.0.1:8080" \
            --duration=8s \
            --if-nonempty=clear \
            --namespace-prefix=ci-smoke \
            ../benchmarks/smoke.toml
